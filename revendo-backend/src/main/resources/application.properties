
# =========================================================
# ReVendo - Spring Boot Application Configuration
# =========================================================

# --- Server ---
server.port=8080

# --- MySQL Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/revendo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- SQL Initialisation ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${user.dir}/src/main/resources/static/images

# --- Static resources ---
spring.web.resources.static-locations=classpath:/static/,file:${user.dir}/src/main/resources/static/

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Logging ---
logging.level.com.revendo=DEBUG
logging.level.org.springframework.security=INFO
